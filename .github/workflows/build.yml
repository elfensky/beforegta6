name: Build

# Build main and develop as :sha-<commit>. Pin only on dedicated deployment branches:
# main -> deploy/production, develop -> deploy/staging. Arcane reads the selected environment's compose file there.
# The pin copies compose configuration from the built SHA and preserves the other environment's image tag.
# Source branches receive no bot commits. Deployment branches do not trigger this workflow.

on:
  push:
    branches: [main, develop]
    # Root-level docs (a single `*` does not cross a `/`), docs/, research/ and .planning/ do not change the image.
    # Compose changes trigger a build so deployment branches receive the matching configuration.
    # Card Markdown under src/content/ is deliberately included: it is the site's content.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'research/**'
      - '.planning/**'
  workflow_dispatch:

# Serialize each source branch. The pin script also rejects stale builds and retries target push races.
concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate deployment source
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$BRANCH" in
            main|develop) ;;
            *) echo "::error::Only main and develop can deploy"; exit 1 ;;
          esac
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - run: npm ci
      # dist/ must exist before the docker build reads it from the context.
      - run: npm run build
      # The Pis are arm64, the runner amd64. dist/ is the same on both, so only the nginx stage is multi-arch.
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

  pin:
    name: Pin image in compose
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          # The pin guard checks ancestry and ignores documentation-only descendants.
          fetch-depth: 0
      - name: Pin the built image and commit
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: bash scripts/pin-image.sh
