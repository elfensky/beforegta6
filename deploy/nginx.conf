# nginx server block baked into the image. Adapted from miklav.com's deploy/swarm/nginx.conf; the reasons behind each
# header live in that file's comments. Cloudflare owns TLS: this speaks plain HTTP on the overlay network only.
#
# Never put an add_header inside a location: it silently drops every server-level add_header for that location.

# Only the apex is indexable. staging.beforegta6.wtf and the healthcheck's 127.0.0.1 get noindex. An empty value means nginx
# sends no X-Robots-Tag at all.
map $host $robots_tag {
    default         "noindex";
    beforegta6.wtf  "";
}

# /_astro/ is content-hashed, so a year with immutable is safe. Everything else (HTML, the 404 page, root files):
# browsers revalidate each time, and Cloudflare keeps it 5 minutes, so a spike stays at the edge (deploy/README.md
# step 8). Cloudflare reads CDN-Cache-Control in place of Cache-Control. It is not s-maxage, because s-maxage turns off
# stale-if-error at Cloudflare. stale-if-error serves the cached page for a day while the origin answers 5xx.
map $uri $cache_control {
    default      "public, max-age=0";
    ~^/_astro/   "public, max-age=31536000, immutable";
}
map $uri $cdn_cache_control {
    default      "max-age=300, stale-if-error=86400";
    ~^/_astro/   "";
}

server {
    listen 80;
    server_name beforegta6.wtf;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # cloudflared reaches this as http://web:80; a trailing-slash redirect must stay relative.
    absolute_redirect off;
    error_page 404 /404.html;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag $robots_tag always;
    add_header CDN-Cache-Control $cdn_cache_control always;
    # No script-src: AdSense loads from Google hosts that Google does not list, and Google's own policy needs a
    # per-request nonce, which would stop the edge cache (deploy/README.md § AdSense). The other directives cost AdSense
    # nothing.
    add_header Content-Security-Policy "object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;

    # The old timeline page, live in production until the line timeline (2026-11-15). A return-only location keeps the
    # server-level headers.
    location ~ ^/timeline/?$ {
        return 301 /;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Reached only through error_page, so /404.html does not also answer 200 at its own address.
    location = /404.html {
        internal;
    }
}
