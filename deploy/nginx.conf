# nginx server block baked into the image. Adapted from miklav.com's deploy/swarm/nginx.conf; the reasons behind each
# header live in that file's comments. Cloudflare owns TLS: this speaks plain HTTP on the overlay network only.
#
# Never put an add_header inside a location: it silently drops every server-level add_header for that location.

# Only the apex is indexable. staging.beforegta6.wtf and the healthcheck's 127.0.0.1 get noindex. An empty value means nginx
# sends no X-Robots-Tag at all.
map $host $robots_tag {
    default         "noindex";
    beforegta6.wtf  "";
}

# /_astro/ is content-hashed, so a year with immutable is safe. HTML gets no-cache, so a redeploy is seen at once
# (Cloudflare's own Cache Rule decides the edge TTL).
map $uri $cache_control {
    default      "no-cache";
    ~^/_astro/   "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name beforegta6.wtf;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # cloudflared reaches this as http://web:80; a trailing-slash redirect must stay relative.
    absolute_redirect off;
    error_page 404 /404.html;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag $robots_tag always;
    # AdSense supports only Google's strict policy (deploy/README.md § AdSense): a per-request nonce on every script
    # tag, and 'strict-dynamic' for what those scripts load. Google publishes no host allowlist, so the policy limits no
    # other fetches: a stricter one may break the ads without notice. The other sources are fallbacks for old browsers.
    add_header Content-Security-Policy "script-src 'nonce-$request_id' 'unsafe-inline' 'unsafe-eval' 'strict-dynamic' https: http:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    # The nonce goes on every script tag of the HTML (sub_filter_types: text/html only).
    sub_filter '<script' '<script nonce="$request_id"';
    sub_filter_once off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;

    # The old timeline page, live in production until the line timeline (2026-11-15). A return-only location keeps the
    # server-level headers.
    location ~ ^/timeline/?$ {
        return 301 /;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Reached only through error_page, so /404.html does not also answer 200 at its own address.
    location = /404.html {
        internal;
    }
}
