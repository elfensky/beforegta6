# nginx server block baked into the image. Adapted from miklav.com's deploy/swarm/nginx.conf; the reasons behind each
# header live in that file's comments. Cloudflare owns TLS: this speaks plain HTTP on the overlay network only.
#
# Never put an add_header inside a location: it silently drops every server-level add_header for that location.

# Only the apex is indexable. staging.beforegta6.wtf and the healthcheck's 127.0.0.1 get noindex. An empty value means nginx
# sends no X-Robots-Tag at all.
map $host $robots_tag {
    default         "noindex";
    beforegta6.wtf  "";
}

# /_astro/ is content-hashed, so a year with immutable is safe. HTML gets no-cache, so a redeploy is seen at once
# (Cloudflare's own Cache Rule decides the edge TTL).
map $uri $cache_control {
    default      "no-cache";
    ~^/_astro/   "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name beforegta6.wtf;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # cloudflared reaches this as http://web:80; a trailing-slash redirect must stay relative.
    absolute_redirect off;
    error_page 404 /404.html;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag $robots_tag always;
    # No third-party script yet but Umami. Turning AdSense on replaces this with Google's nonce-based policy
    # (deploy/README.md § AdSense): Google publishes no host allowlist for its ad code.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://umami.lav.ren; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://umami.lav.ren; form-action 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;

    location / {
        try_files $uri $uri/ =404;
    }

    # Reached only through error_page, so /404.html does not also answer 200 at its own address.
    location = /404.html {
        internal;
    }
}
